# Bygger en binær pr. platform med PyInstaller, når et tag som v1.2.3
# pushes, og lægger dem sammen med thehome.json på en GitHub-release.
# PyInstaller kan ikke krydskompilere, så hver platform bygges på sin egen
# runner. Linux bygges på Ubuntu 22.04 (glibc 2.35), så binæren også kører i
# TheHomes Docker-image (Debian bookworm, glibc 2.36).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # domænet fra thehome.json
  DOMAIN: example_counter_python

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, ext: .exe }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, ext: "" }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu, ext: "" }
          - { os: macos-latest, target: aarch64-apple-darwin, ext: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller
      - run: python -m unittest discover -s tests
      - run: pyinstaller --onefile --name "$DOMAIN" --noconfirm main.py
        shell: bash
      - shell: bash
        run: |
          mkdir out
          cp "dist/$DOMAIN${{ matrix.ext }}" "out/$DOMAIN-${{ matrix.target }}${{ matrix.ext }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: out/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      # A release published on github.com already exists; then only add the files.
      - run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/* thehome.json --clobber
          else
            gh release create "$GITHUB_REF_NAME" out/* thehome.json --title "$GITHUB_REF_NAME" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
